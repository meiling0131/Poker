# Verve Poker online server: a Cloudflare Worker with one Durable Object per room.
# Local:  npx wrangler dev        Deploy:  npx wrangler deploy
name = "verve-poker"
main = "server/worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
