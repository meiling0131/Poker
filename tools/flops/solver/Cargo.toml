[package]
name = "flop-solve"
version = "0.1.0"
edition = "2021"
# postflop-solver is AGPL-3.0, so this little program is too. It only runs offline; the game gets its output (data).
license = "AGPL-3.0-or-later"
description = "Exact flop solves for the poker bots' table, on b-inary/postflop-solver"
publish = false

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
