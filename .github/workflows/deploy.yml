# Every push to main: lint + tests, then build, make sure the D1 database exists, apply new migrations and
# deploy the Worker to the Cloudflare account in wrangler.jsonc (https://verve.vpoker.workers.dev).
# The repo secret CLOUDFLARE_API_TOKEN needs Workers Scripts: Edit and D1: Edit on that account
# (DEPLOY.md, "C. Deploy from GitHub Actions"). Without D1 access it stops before anything is deployed.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time; a newer push waits rather than cutting a migration short
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx -y eslint@10 .
      - run: npm test
      - run: npm run build
      - name: D1 database (created the first time)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          if node -e "process.exit(require(process.argv[1]).some(d=>d.name==='verve')?0:1)" "$RUNNER_TEMP/d1.json"; then
            echo "D1 database verve is there"
          else
            npx wrangler d1 create verve
          fi
      - name: Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply verve --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
