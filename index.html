<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1311">
<title>Verve Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="css/0-tokens.css?v=dfd73eea">
<link rel="stylesheet" href="css/1-base.css?v=765bec26">
<link rel="stylesheet" href="css/2-layout.css?v=00346bc8">
<link rel="stylesheet" href="css/3-theme.css?v=812515ac">
<link rel="stylesheet" href="css/4-features.css?v=f3843a06">
<link rel="stylesheet" href="css/5-skins.css?v=3906f49f">
<link rel="stylesheet" href="css/6-lobby.css?v=02578ed1">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row">
      <button class="flr f1" data-skin="f1" aria-label="Verve 一楼 · 会议室"><i aria-hidden="true"></i><span><b>一楼</b><small>会议室</small></span></button>
      <h1>Verve Poker</h1>
      <button class="flr f2" data-skin="f2" aria-label="Verve 二楼 · 休息区"><i aria-hidden="true"></i><span><b>二楼</b><small>休息区</small></span></button>
      <div class="right">
      <div class="nav" id="nav" hidden><button data-view="table" class="on">牌桌</button><button data-view="records">记录</button></div>
      <button class="ghost icon" id="homeBtn" hidden aria-label="回到主页">主页</button>
      <div class="morewrap">
        <button class="ghost icon" id="moreBtn" hidden aria-label="设置" aria-expanded="false">设置</button>
        <div class="more" id="more" hidden>
          <label class="hintToggle"><span>牌型提示</span><input id="handHints" type="checkbox" role="switch"></label>
          <label class="hintToggle"><span>轮到我时提醒</span><input id="soundOn" type="checkbox" role="switch"></label>
          <div class="skinpick"><span>牌桌</span><div class="seg" id="skin" role="group" aria-label="牌桌皮肤"><button data-skin="f1">一楼</button><button data-skin="f2">二楼</button></div></div>
          <div class="seg" id="speed" hidden>
            <button data-speed="1100">慢</button><button data-speed="650" class="on">中</button><button data-speed="250">快</button>
          </div>
          <button class="ghost" id="restart" hidden>重置牌桌</button>
        </div>
      </div>
      </div>
    </div>
    <div class="pills" id="pills"></div>
  </header>
  <div class="banner" id="away" hidden>房主暂时不在线，牌局暂停。房主回来后从当前这一步继续。</div>
  <section id="menu"></section>
  <section id="game">
    <div class="table" id="table"></div>
    <section class="hero" id="hero"></section>
  </section>
  <section id="records"></section>
</div>

<script type="importmap">

    "./js/ui/events.js": "./js/ui/events.js?v=a221011e",
    "./js/ui/hero-view.js": "./js/ui/hero-view.js?v=1b9b830f",
    "./js/ui/menu-view.js": "./js/ui/menu-view.js?v=f0b06c8b",

  }
}

</body>
</html>
