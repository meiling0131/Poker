<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">

<link rel="stylesheet" href="css/3-theme.css?v=7e6c7e20">
<link rel="stylesheet" href="css/4-features.css?v=354bd61e">
<link rel="stylesheet" href="css/5-skins.css?v=88a9054c">

<body>
<div class="wrap">
  <header class="top">
    <div class="row">
      <h1>Verve Poker</h1>
      <div class="right">
      <div class="nav" id="nav" hidden><button data-view="table" class="on" data-i18n="牌桌">牌桌</button><button data-view="records" disabled title="暂未开放" data-i18n="记录" data-i18n-title="暂未开放">记录</button></div>
      <div class="morewrap">
        <button class="ghost icon" id="exitBtn" hidden data-i18n="退出牌桌">退出牌桌</button>
      </div>
      </div>
    </div>
    <div class="pills" id="pills"></div>
  </header>
  <div id="exitPopup" hidden>
    <button type="button" class="usernamePopup-bg" data-exit="no" aria-label="关闭" data-i18n-aria="关闭"></button>
    <div class="usernamePopup-card" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
      <b id="exitTitle" data-i18n="退出牌桌">退出牌桌</b>
      <p class="name-note" data-i18n="您仍在游戏中。要退出牌桌，您将直接弃牌。">您仍在游戏中。要退出牌桌，您将直接弃牌。</p>
      <div class="usernamePopup-actions">
        <button type="button" class="go danger" data-exit="ok" data-i18n="确认">确认</button>
        <button type="button" class="go plain" data-exit="no" data-i18n="取消">取消</button>
      </div>
    </div>
  </div>
  <div id="overtimePopup" hidden>
    <div class="usernamePopup-bg" aria-hidden="true"></div>
    <div class="usernamePopup-card" role="alertdialog" aria-modal="true" aria-labelledby="overtimeTitle">
      <b id="overtimeTitle" data-i18n="超时牌桌">超时牌桌</b>
      <p class="name-note" data-i18n="该牌桌将在 12:05AM 被强制结束。届时您将会被弃牌，但下注的筹码将被退回。">该牌桌将在 12:05AM 被强制结束。届时您将会被弃牌，但下注的筹码将被退回。</p>
      <div class="usernamePopup-actions">
        <button type="button" class="go amber" data-overtime="ok" data-i18n="确认">确认</button>
      </div>
    </div>
  </div>
  <div id="seatPopup" hidden></div>
  <!-- the first time the page opens: 中文 or English (also in 设置) -->
  <div id="langPopup" hidden>
    <div class="usernamePopup-bg" aria-hidden="true"></div>
    <div class="usernamePopup-card" role="dialog" aria-modal="true" aria-labelledby="langTitle">
      <b id="langTitle">Verve Poker</b>
      <p class="name-note">选择语言 · Choose your language</p>
      <div class="usernamePopup-actions">
        <button type="button" class="go amber" data-lang-pick="zh" lang="zh-CN">中文</button>
        <button type="button" class="go teal" data-lang-pick="en" lang="en">English</button>
      </div>
    </div>
  </div>
  <section id="menu"></section>
  <section id="game">
    <div class="stage" id="stage">
      <div class="table" id="table"></div>
      <div class="me-seat" id="meSeat"></div>
    </div>
    <section class="hero" id="hero"></section>
  </section>
  <section id="records"></section>
</div>
